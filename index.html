<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f7f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>KRYOS</title>
    <link rel="stylesheet" href="styles.css?v=0.5.13" />
    <link rel="stylesheet" href="life.css?v=0.5.13" />
    <link rel="stylesheet" href="rhythm.css?v=0.5.13" />
    <link rel="stylesheet" href="money.css?v=0.5.13" />
    <link rel="stylesheet" href="inner-command.css?v=0.5.13" />
    <link rel="stylesheet" href="launch.css?v=0.5.13" />
    <link rel="stylesheet" href="reward-system.css?v=0.5.13" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand">
          <div class="brand-mark">K</div>
          <div>
            <p class="brand-title">KRYOS</p>
            <p class="brand-subtitle">Directed attention</p>
          </div>
        </div>

        <nav class="nav-list">
          <button class="nav-item is-active" type="button" data-page="journal">Inner Command</button>
          <button class="nav-item" type="button" data-page="actions">Actions</button>
          <button class="nav-item" type="button" data-page="career">Career</button>
          <button class="nav-item" type="button" data-page="launch">Launch</button>
          <button class="nav-item" type="button" data-page="rhythm">Rhythm</button>
          <button class="nav-item" type="button" data-page="money">Money</button>
          <button class="nav-item" type="button" data-page="progress">Progress</button>
          <button class="nav-item" type="button" data-page="rewards">Rewards</button>
        </nav>
      </aside>

      <main class="main" id="app">
        <header class="topbar">
          <div>
            <p class="eyebrow">Daily record</p>
            <h1>Inner Command</h1>
          </div>
          <div class="topbar-actions">
            <button class="mobile-refresh-button" type="button" data-sync-action="safe-refresh" aria-label="Refresh cloud data" title="Refresh cloud data">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M5.1 9A8 8 0 0 1 18.5 6L20 11M4 13l1.5 5A8 8 0 0 0 18.9 15" /></svg>
            </button>
            <span class="global-cloud-state state-local" data-global-cloud-state role="status" aria-live="polite" title="Cloud state"><i></i><span>Device saved</span></span>
            <span class="profile-badge personal" data-profile-badge>Personal</span>
            <button class="secondary-button top-lock-button" type="button" data-security-action="manual-lock">Lock</button>
            <button class="secondary-button mobile-settings-button" type="button" data-page="settings" aria-label="Open mobile settings">Settings</button>
            <div class="mode-switch is-hidden" aria-label="View mode">
              <button class="mode-button is-active" type="button" data-mode="read">Read</button>
              <button class="mode-button" type="button" data-mode="edit">Edit</button>
            </div>
          </div>
        </header>

        <section id="read-view" class="view"></section>
        <section id="edit-view" class="view is-hidden"></section>
        <section id="career-view" class="view is-hidden"></section>
        <section id="launch-view" class="view is-hidden"></section>
        <section id="rhythm-view" class="view is-hidden"></section>
        <section id="money-view" class="view is-hidden"></section>
        <section id="today-view" class="view is-hidden"></section>
        <section id="habits-view" class="view is-hidden"></section>
        <section id="journal-view" class="view is-hidden"></section>
        <section id="actions-view" class="view is-hidden"></section>
        <section id="progress-view" class="view is-hidden"></section>
        <section id="settings-view" class="view is-hidden"></section>
        <section id="focus-view" class="view is-hidden"></section>
        <section id="redirect-view" class="view is-hidden"></section>
        <section id="rewards-view" class="view is-hidden"></section>
        <section id="project-view" class="view is-hidden"></section>
        <section id="review-view" class="view is-hidden"></section>
        <section id="field-view" class="mobile-field-view"></section>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button class="mobile-nav-item is-active" type="button" data-page="journal" aria-label="Open Inner Command"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 7v10l8 4 8-4V7l-8-4Zm0 0v18M4 7l8 4 8-4" /></svg><span>Command</span></button>
      <button class="mobile-nav-item" type="button" data-page="actions" aria-label="Open Actions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6M5 5h5M5 19h14" /></svg><span>Actions</span></button>
      <button class="mobile-nav-item" type="button" data-page="career" aria-label="Open Career"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V8l8-5 8 5v11M8 21v-8h8v8" /></svg><span>Career</span></button>
      <button class="mobile-nav-item" type="button" data-page="rhythm" aria-label="Open Rhythm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-7 4 14 2-7h6" /></svg><span>Rhythm</span></button>
    </nav>

    <section id="security-overlay" class="security-overlay is-hidden" aria-live="polite"></section>

    <script src="vendor/supabase.js?v=0.5.13"></script>
    <script src="assistant-data.js?v=0.5.13"></script>
    <script src="life.js?v=0.5.13"></script>
    <script src="actions.js?v=0.5.13"></script>
    <script src="progress.js?v=0.5.13"></script>
    <script src="https://unpkg.com/lucide@0.468.0"></script>
    <script src="rhythm.js?v=0.5.13"></script>
    <script src="money.js?v=0.5.13"></script>
    <script src="launch.js?v=0.5.13"></script>
    <script src="reward-engine.js?v=0.5.13"></script>
    <script src="rewards.js?v=0.5.13"></script>
    <script src="app.js?v=0.5.13"></script>
  </body>
</html>
